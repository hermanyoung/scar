rules:
  - id: docker.security.cwe-200.arg-env-secret
    patterns:
      - pattern: |
          ARG $TOKEN
      - metavariable-regex:
          metavariable: $TOKEN
          regex: "(?i).*(TOKEN|PASSWORD|SECRET|KEY|CREDENTIAL|ACCESSTOKEN|API_KEY|PRIVATE_KEY|FEED_ACCESS).*"
    message: >
      Build argument '$TOKEN' has a secret-like name and may be persisted in the
      Docker image layer via ENV or command history. Use BuildKit secret mounts
      instead: RUN --mount=type=secret,id=$TOKEN ...
      Secrets set via ARG or ENV are visible in `docker history` even in
      intermediate build stages.
    severity: WARNING
    languages: [dockerfile]
    metadata:
      cwe:
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp:
        - "A01:2021 - Broken Access Control"
      confidence: HIGH
      impact: MEDIUM
      category: security
      technology:
        - docker
      references:
        - https://docs.docker.com/reference/build-checks/secrets-used-in-arg-or-env/
