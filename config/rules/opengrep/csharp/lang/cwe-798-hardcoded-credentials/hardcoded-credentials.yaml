rules:
  - id: csharp.lang.security.cwe-798.hardcoded-credentials
    patterns:
      # A field declaration is a different node from a plain assignment, and
      # listing only assignments meant this rule matched nothing at all.
      - pattern-either:
          - pattern: |
              $TYPE $NAME = $VALUE;
          - pattern: |
              $NAME = $VALUE;
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^\w*(password|passwd|pwd|apikey|secret|token|credential|connectionstring)$
      # Only a non-empty string literal is a leaked credential: a name, a
      # config lookup, or "" is not.
      - metavariable-regex:
          metavariable: $VALUE
          regex: ^"[^"]+"$
    message: >
      Hardcoded credential detected. Passwords, API keys, and secrets should not be
      stored in source code. Use environment variables, Azure Key Vault, AWS Secrets
      Manager, or IConfiguration with user-secrets in development.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      impact: HIGH
      category: security
      technology:
        - .net
