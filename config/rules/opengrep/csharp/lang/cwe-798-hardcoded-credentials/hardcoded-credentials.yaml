rules:
  - id: csharp.lang.security.cwe-798.hardcoded-credentials
    patterns:
      - pattern-either:
          - pattern: |
              $X = "Password=...";
          - pattern: |
              Password = "..."
          - pattern: |
              password = "..."
          - pattern: |
              ApiKey = "..."
          - pattern: |
              apiKey = "..."
          - pattern: |
              Secret = "..."
          - pattern: |
              secret = "..."
          - pattern: |
              ConnectionString = "...Password=...";
    message: >
      Hardcoded credential detected. Passwords, API keys, and secrets should not be
      stored in source code. Use environment variables, Azure Key Vault, AWS Secrets
      Manager, or IConfiguration with user-secrets in development.
    severity: ERROR
    languages: [csharp]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      impact: HIGH
      category: security
      technology:
        - .net
