rules:
  - id: csharp.lang.security.cwe-532.sensitive-logging
    patterns:
      # The string-ellipsis form ($"...password...") does not match inside a
      # C# interpolated string, so the previous 27 patterns never fired. Bind
      # the whole argument instead and test its text.
      - pattern-either:
          - pattern: $LOGGER.LogInformation($MSG)
          - pattern: $LOGGER.LogWarning($MSG)
          - pattern: $LOGGER.LogError($MSG)
          - pattern: $LOGGER.LogDebug($MSG)
          - pattern: $LOGGER.LogCritical($MSG)
          - pattern: $LOGGER.LogTrace($MSG)
          - pattern: Console.WriteLine($MSG)
      # Require an interpolated string naming a secret. A plain literal carries
      # no runtime value, and the structured form (template + separate args)
      # keeps the value out of the message entirely.
      # The keyword must sit against an interpolation -- either labelling one
      # ("token={x}") or naming one ("{password}"). Merely containing the word
      # is not enough, or "Estimated tokens: {n}" reads as a leaked credential.
      - metavariable-regex:
          metavariable: $MSG
          regex: (?i)^\$".*((password|passwd|pwd|token|secret|api_?key|credential)\s*[=:]\s*\{|\{\s*(password|passwd|pwd|token|secret|api_?key|credential)\b)
    message: >
      Sensitive data (password, token, secret, API key) is being logged.
      Log files are often stored in plain text and aggregated in log
      management systems. Redact sensitive values before logging, or log
      only non-sensitive identifiers (UserId, RequestId).
    severity: WARNING
    languages: [csharp]
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
      confidence: MEDIUM
      impact: MEDIUM
      category: security
      technology:
        - csharp
