rules:
  - id: python.lang.security.cwe-078.subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
    message: >
      Subprocess with shell=True or os.system()/os.popen() detected. If arguments
      include user input, this enables OS command injection. Use subprocess.run()
      with shell=False and pass arguments as a list.
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp:
        - "A03:2021 - Injection"
      confidence: MEDIUM
      impact: HIGH
      category: security
      technology:
        - python
