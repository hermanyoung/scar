rules:
  - id: python.lang.security.cwe-532.sensitive-logging
    patterns:
      - pattern-either:
          - pattern: logger.$METHOD(..., password=..., ...)
          - pattern: logger.$METHOD(..., token=..., ...)
          - pattern: logger.$METHOD(..., secret=..., ...)
          - pattern: logger.$METHOD(..., api_key=..., ...)
          - pattern: logger.$METHOD(..., credential=..., ...)
          # Literal text between ellipses does not match inside an f-string
          # (unlike f"...{$X}..."), so the previous f-string patterns never
          # fired. Bind the whole argument and test its text instead.
          - patterns:
              - pattern-either:
                  - pattern: logger.$METHOD($MSG)
                  - pattern: logging.$METHOD($MSG)
                  - pattern: print($MSG)
              # The keyword must sit against an interpolation -- either
              # labelling one ("token={x}") or naming one ("{password}").
              # Merely containing the word is not enough, or "Estimated
              # tokens: {n}" reads as a leaked credential.
              - metavariable-regex:
                  metavariable: $MSG
                  regex: (?i)^f['"].*((password|passwd|pwd|token|secret|api_?key|credential)\s*[=:]\s*\{|\{\s*(password|passwd|pwd|token|secret|api_?key|credential)\b)
    message: >
      Sensitive data (password, token, secret, API key) is being logged or
      printed. Log files are often stored in plain text, shared across teams,
      and aggregated in log management systems. Redact sensitive values before
      logging, or log only non-sensitive identifiers (user_id, request_id).
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
      confidence: MEDIUM
      impact: MEDIUM
      category: security
      technology:
        - python
