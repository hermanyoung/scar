rules:
  - id: python.lang.security.cwe-798.hardcoded-credentials
    patterns:
      - pattern-either:
          - pattern: password = "..."
          - pattern: PASSWORD = "..."
          - pattern: api_key = "..."
          - pattern: API_KEY = "..."
          - pattern: secret = "..."
          - pattern: SECRET = "..."
          - pattern: secret_key = "..."
          - pattern: SECRET_KEY = "..."
          - pattern: token = "..."
          - pattern: TOKEN = "..."
    message: >
      Hardcoded credential detected. Passwords, API keys, secrets, and tokens
      should not be stored in source code. Use environment variables (os.environ),
      a secrets manager, or a .env file (excluded from version control).
    severity: ERROR
    languages: [python]
    metadata:
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      impact: HIGH
      category: security
      technology:
        - python
