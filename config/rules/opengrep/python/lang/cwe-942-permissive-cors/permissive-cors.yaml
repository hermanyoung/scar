rules:
  - id: python.lang.security.cwe-942.permissive-cors
    patterns:
      - pattern-either:
          - pattern: CORS($APP, origins="*")
          - pattern: CORS($APP, resources=..., origins="*")
          - pattern: CORS(..., allow_origins=["*"], ...)
          - pattern: |
              CORS_ALLOWED_ORIGINS = ["*"]
          - pattern: |
              CORS_ORIGIN_ALLOW_ALL = True
          - pattern: |
              CORS_ALLOW_ALL_ORIGINS = True
          - pattern: |
              allow_origins=["*"]
          - pattern: $RESPONSE.headers["Access-Control-Allow-Origin"] = "*"
          - pattern: $RESPONSE.headers.add("Access-Control-Allow-Origin", "*")
    message: >
      CORS is configured to allow all origins (*). This permits any website to
      make cross-origin requests to your API, potentially enabling CSRF-like
      attacks, data theft, and credential abuse. Restrict allowed origins to
      specific trusted domains.
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      confidence: HIGH
      impact: MEDIUM
      category: security
      technology:
        - python
        - django
        - flask
        - fastapi
