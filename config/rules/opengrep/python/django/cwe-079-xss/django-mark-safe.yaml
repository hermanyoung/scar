rules:
  - id: python.django.security.cwe-079.django-mark-safe
    pattern: mark_safe($X)
    message: >
      Django mark_safe() used on potentially user-controlled input. mark_safe()
      bypasses Django's auto-escaping, which can lead to XSS. Only use mark_safe()
      on trusted, pre-sanitised content. Use format_html() for safe string formatting.
    severity: WARNING
    languages: [python]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A03:2021 - Injection"
      confidence: MEDIUM
      impact: MEDIUM
      category: security
      technology:
        - python
        - django

  - id: python.django.security.cwe-079.jinja2-autoescape-false
    pattern: |
      jinja2.Environment(..., autoescape=False, ...)
    message: >
      Jinja2 environment created with autoescape disabled. This allows XSS if
      templates render user-controlled data. Set autoescape=True or use
      select_autoescape().
    severity: ERROR
    languages: [python]
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      confidence: HIGH
      impact: HIGH
      category: security
      technology:
        - python
        - jinja2
