# =============================================================================
# LLM Pricing (per token)
# =============================================================================
# Loaded by: src/security_review/budget.py
# Schema:    each entry is a model key with two required fields:
#
#   <provider:model-id>:
#     input_per_token:  float   # USD per input token
#     output_per_token: float   # USD per output token
#
# Key format: "provider:model-id" in RESOLVED/WIRE form — the string
# CostTracker.record() looks up AFTER alias expansion and provider-specific
# override from config/models.yaml (resolve_model_name()), not the raw
# --provider string an operator types. Copilot/claude wire IDs use dots
# (claude-opus-4.6); anthropic/openai wire IDs use dashes (claude-opus-4-6) —
# see config/models.yaml's providers.<name> overrides for why they differ.
# Every model used must have an explicit entry — missing entries fail fast.
# Add new entries here when onboarding a model — never hardcode in Python.
# =============================================================================

