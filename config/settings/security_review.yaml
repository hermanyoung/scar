# =============================================================================
# Security Review Configuration
# =============================================================================
# Loaded by: src/security_review/config.py → config_schema.py
# Schema:    SecurityReviewConfig (all fields required unless noted)
#
# llm:
#   provider_model:       str     # "provider:model" e.g. "copilot:claude-opus"
#   triage_model:         str?    # override for Pass 3. null = use provider_model
#   output_retries:       int     # 1-5 (default: 3)
#   max_budget_usd:       float   # 0 = unlimited
#   max_tokens_per_batch: int     # 10k-500k (default: 150000)
#   concurrency:          int     # 1-50, agent calls dispatched in parallel
#   cache_ttl:            str?    # "ephemeral" | "5m" | "1h" | null (Anthropic only)
#   thinking_budget:      int?    # 1000-100000 | null (Anthropic only)
#   temperature:          float?  # 0.0-2.0 | null = provider default
#   foundry_base_url:     str?    # Azure OpenAI data-plane endpoint (foundry: models)
#   foundry_api_version:  str?    # Azure OpenAI API version (foundry: models)
#   foundry_token_scope:  str?    # Entra ID scope; differs in sovereign clouds
#   providers:
#     <name>:                     # copilot | claude | anthropic | openai | codex
#       max_concurrent:   int     # 1-100
#       session_timeout:  float   # 10-600 seconds
#       backoff_seconds:  float   # 1-60 seconds
#
# sast:
#   opengrep_rules_path:          str   # relative path to OpenGrep rules (config/rules/opengrep)
#   gitleaks_config_path:         str   # relative path to gitleaks config (config/rules/gitleaks/...)
#   roslyn_props_path:            str   # relative path to Roslyn security props (config/rules/roslyn/...)
#   scanner_timeout_seconds:      int   # 30-1800
#   scanner_max_file_size_bytes:  int   # min 1024
#
# triage:
#   fp_confidence_threshold:  float  # 0.0-1.0
#   min_score:                float  # 0.0-1.0, priority threshold for triage
#   default_confidence:       float  # 0.0-1.0, used when LLM omits confidence
#
# verification:
#   enabled:              bool    # run Pass 6 adversarial verification of LLM findings
#   model:                str?    # override model. null = use llm.provider_model
#   samples:              int     # 1-5 skeptic votes per finding
#   verify_holistic:      bool    # verify Pass 4 (holistic) findings
#   verify_config_review: bool    # verify Pass 5 (config review) findings
#
# review:
#   mode:            str   # "full" | "sast" | "sast-triage"
#   target_path:     str   # codebase root (overridden by CLI --target)
#   output_sarif:    str   # SARIF output filename
#   output_summary:  str   # markdown summary filename (default: security-report.md)
#   output_triage:   str   # triage audit log filename (default: triage.json)
#   exclude:         list[str]  # fnmatch globs (relative paths) to exclude from inventory. [] = none
#   include:         list[str]  # when non-empty, only matching relative paths are reviewed. [] = all
#
# foundry:                      # optional block; required only by `list-models --foundry`
#   subscription_id:     str    # Azure subscription GUID
#   resource_group:      str
#   account_name:        str    # Cognitive Services / AIServices account
#   location:            str    # Azure region, e.g. swedencentral
#   az_timeout_seconds:  int    # 10-600, per az CLI call
# =============================================================================

llm:
  # Azure AI Foundry is the default while Anthropic models are blocked from
  # deployment by the approved-publisher policy. gpt-5.4 is the strongest chat
  # deployment on the resource; gpt-5-mini handles triage at ~1/10th the cost.
  provider_model: "foundry:gpt-5.4"
  triage_model: "foundry:gpt-5-mini"

  # Foundry inference endpoint. Separate from the top-level `foundry:` block:
  # that one holds ARM coordinates for enumerating models, this is the
  # data-plane endpoint agents actually call. The resource runs with
  # disableLocalAuth=true, so there is no API key — auth is Entra ID via
  # DefaultAzureCredential (`az login` locally, managed identity in CI).
  foundry_base_url: "https://gis-mission-control-resource.openai.azure.com/"
  foundry_api_version: "2024-12-01-preview"
  foundry_token_scope: "https://cognitiveservices.azure.com/.default"
  output_retries: 3
  max_budget_usd: 100            # Safety net for runaway agents. 0 = unlimited.
  max_tokens_per_batch: 150000
  # Pass-level: how many agent calls dispatched concurrently.
  # Effective parallelism = min(this, providers.<name>.max_concurrent).
  concurrency: 2

  # Anthropic-specific: prompt caching (90% savings on repeated system prompts).
  # All 28 CWE checks share the same system prompt — checks 2-28 hit cache.
  # Values: "ephemeral" (request-scoped), "5m", "1h", "None" (disabled).
  # Only applies when provider_model starts with "anthropic:".
  cache_ttl: "ephemeral"

  # Anthropic-specific: extended thinking for complex reasoning.
  # Set to token budget (e.g. 10000) for authZ closure, deserialization chains.
  # Only applies when provider_model starts with "anthropic:". null = disabled.
  # thinking_budget: 10000

  # OpenAI-family equivalent of thinking_budget, for the reasoning models
  # behind openai: and foundry:. Values: minimal | low | medium | high.
  # Unset, these deployments answer straight from the prompt and spend zero
  # reasoning tokens. Set alongside temperature, this one wins: the SDK
  # refuses sampling parameters once reasoning is on.
  #
  # "medium" is measured, not assumed. Nine golden runs (3 each at high,
  # medium, off) scored 8.0 / 8.67 / 7.67 of 11 -- a wash on aggregate, but
  # two CWEs move in opposite directions and neither extreme wins both:
  #   CWE-319 passes 3/3 at high, 1/3 at medium, 0/3 at off
  #   CWE-312 passes 1/3 at high, 2/3 at medium, 3/3 at off
  # More reasoning makes the model argue itself out of reporting the simpler
  # findings. High also tripped the 180s per-check timeout. Medium scores
  # best overall at roughly half the cost and latency of high.
  reasoning_effort: "medium"

  # LLM sampling temperature — controls result determinism.
  # null = provider default (typically 1.0 for Claude, 1.0 for GPT).
  # 0.0  = fully deterministic, reproducible across runs (recommended for CI/benchmarks).
  # 0.2  = low variance, occasional novel findings.
  # ProviderConfig has no per-provider temperature override — this single
  # value applies to every provider that respects temperature (ADR-002:
  # the Copilot SDK ignores it and hardcodes 0.1 server-side regardless).
  # The foundry: GPT-5 deployments also ignore it — the SDK warns "Sampling
  # parameters ['temperature'] are not supported when reasoning is enabled".
  # So under the current foundry default this knob is inert, and runs are not
  # reproducible via temperature alone.
  temperature: 0.2

  # Per-provider capacity settings.
  # Each provider has different rate limits and transport characteristics.
  # backoff_seconds seeds the uniform transport-retry policy (RetryingModel,
  # plan 020 Phase 3) applied to ALL providers: exponential backoff on
  # non-fatal transport errors and on empty responses, bounded attempts.
  # session_timeout is honored by the copilot adapter, which also keeps its
  # internal fresh-session timeout retry (bounded belt-and-suspenders).
  providers:
    copilot:
      max_concurrent: 2          # Copilot API rate-limits aggressively. 2 is safe.
      session_timeout: 300.0     # Large-repo CWE checks can inline 100+ files
                                  # (150k+ input tokens); 120s was observed
                                  # timing out on real codebases this size.
      backoff_seconds: 10.0      # Wait before fresh-session retry on timeout.
    claude:
      max_concurrent: 2          # Claude Agent SDK (Max/Pro OAuth). Conservative limit.
      session_timeout: 300.0     # Agent SDK has subprocess overhead; large-repo
                                  # batches need the same headroom as copilot.
      backoff_seconds: 10.0
    anthropic:
      max_concurrent: 10         # httpx connection pooling handles concurrency natively.
      session_timeout: 120.0
      backoff_seconds: 5.0
    openai:
      max_concurrent: 10
      session_timeout: 120.0
      backoff_seconds: 5.0
    codex:
      max_concurrent: 5          # Codex OAuth (ChatGPT subscription). Moderate limits.
      session_timeout: 120.0
      backoff_seconds: 5.0
    foundry:
      max_concurrent: 8          # Azure OpenAI via httpx pooling. Bounded by the
                                  # deployment's TPM quota, not the client.
      session_timeout: 300.0     # Large-repo CWE checks inline 150k+ input tokens.
      backoff_seconds: 5.0

sast:
  opengrep_rules_path: "config/rules/opengrep"
  gitleaks_config_path: "config/rules/gitleaks/.gitleaks.toml"
  roslyn_props_path: "config/rules/roslyn/Directory.Build.security.props"
  scanner_timeout_seconds: 300
  scanner_max_file_size_bytes: 1048576   # 1 MB

triage:
  fp_confidence_threshold: 0.75
  min_score: 0.20                        # MODERATE+ threshold. 0.0 = triage everything.
  default_confidence: 0.5                # Assigned when LLM omits confidence. Low = conservative.

# Pass 6: independent adversarial verification of LLM-discovered findings.
# A separate skeptic agent re-reads the source and assigns its own verdict —
# it never sees the finder's reasoning (anti-anchoring, plan 020).
verification:
  enabled: true
  model: null            # null = use llm.provider_model. A cheaper model here is fine.
  samples: 1             # 1 = single skeptic. 3 = majority-refute (higher cost, higher precision).
  verify_holistic: true
  verify_config_review: false

# Azure AI Foundry resource that `scar.py list-models --foundry` enumerates.
# Coordinates only — no credentials. Auth comes from the operator's `az login`
# session, and every field is explicit so the command always reports which
# resource it queried instead of inheriting the active az subscription.
# Remove this block if you do not use Foundry; nothing else reads it.
foundry:
  subscription_id: "e9ae84d8-7fa3-49c1-838e-81ce8a57a576"
  resource_group: "rg-secrch-mission-control-dev-001"
  account_name: "gis-mission-control-resource"
  location: "swedencentral"
  az_timeout_seconds: 120

review:
  mode: "full"
  target_path: "."
  output_sarif: "security-report.sarif"
  output_summary: "security-report.md"
  output_triage: "triage.json"
  exclude: []
  include: []
