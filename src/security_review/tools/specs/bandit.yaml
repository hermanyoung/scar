name: bandit
binary: bandit
version_cmd: ["bandit", "--version"]
output_format: sarif
sarif_native: true
success_exit_codes: [0, 1]
arg_template: ["{binary}", "-r", "{target_path}", "-f", "sarif", "-o", "{output_path}", "--severity-level", "medium"]
output_capture: file
timeout_seconds: 120
target_type: directory
applies_to: ["*.py"]
cwe_source: metadata
