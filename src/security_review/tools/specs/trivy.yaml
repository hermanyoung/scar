name: trivy
binary: trivy
version_cmd: ["trivy", "--version"]
output_format: sarif
sarif_native: true
success_exit_codes: [0, 1]
arg_template: ["{binary}", "fs", "--scanners", "vuln", "--format", "sarif", "--output", "{output_path}", "--severity", "MEDIUM,HIGH,CRITICAL", "{target_path}"]
output_capture: file
timeout_seconds: 300
target_type: directory
applies_to: ["*.csproj", "*.sln", "requirements*.txt", "Pipfile.lock", "poetry.lock", "package.json", "pnpm-lock.yaml", "package-lock.json", "yarn.lock"]
cwe_source: metadata
optional: true
