# DEPRECATED: Use trivy instead (covers .NET + Python + npm/pnpm in one tool).
# Kept as fallback for environments where trivy is not installed.
name: pip-audit
binary: pip-audit
version_cmd: ["pip-audit", "--version"]
output_format: json
sarif_native: false
success_exit_codes: [0, 1]
arg_template: ["{binary}", "-r", "{target_path}", "-f", "json", "-o", "{output_path}", "--desc"]
output_capture: file
timeout_seconds: 300
target_type: file
applies_to: ["requirements*.txt"]
cwe_source: mapping_file
optional: true
