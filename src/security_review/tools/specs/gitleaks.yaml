name: betterleaks
binary: betterleaks
version_cmd: ["betterleaks", "version"]
output_format: sarif
sarif_native: true
success_exit_codes: [0, 1]
arg_template: ["{binary}", "dir", "{target_path}", "--report-format", "sarif", "--report-path", "{output_path}", "--config", "{config_path}", "--redact", "--exit-code", "1", "--no-banner"]
default_args:
  config_path: "config/rules/gitleaks/.gitleaks.toml"
output_capture: file
redact_output: true
timeout_seconds: 120
target_type: directory
applies_to: []
cwe_source: none
