name: roslyn
binary: dotnet
version_cmd: ["dotnet", "--version"]
output_format: sarif
sarif_native: true
success_exit_codes: [0, 1]
arg_template: ["{binary}", "build", "{target_path}", "/p:ErrorLog={output_path},version=2.1", "/p:TreatWarningsAsErrors=false"]
output_capture: file
timeout_seconds: 600
target_type: directory
applies_to: ["*.sln", "*.csproj"]
cwe_source: metadata
optional: true
