[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scar"
version = "1.0.0"
description = "SCAR — Security Code AI Review. SAST + LLM security analysis pipeline."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "click>=8.0",
    "structlog>=24.0",
    "rich>=13.0",
    "tree-sitter>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "rustworkx>=0.15",
]

# pydantic-ai is pinned exactly (==1.63.0) everywhere it's named below.
# ADR-001 discipline: floating LLM-stack deps have bitten us before —
# A/B test before ANY upgrade (see scripts/benchmark_cwes.py --ab-sdk).
[project.optional-dependencies]
openai = ["pydantic-ai[openai]==1.63.0"]
anthropic = ["pydantic-ai[anthropic]==1.63.0"]
copilot = ["github-copilot-sdk==0.2.2", "json-repair>=0.30"]
claude = ["claude-agent-sdk>=0.1.63"]
callgraph = ["pyan3>=2.6"]
all = [
    "pydantic-ai[openai,anthropic]==1.63.0",
    "bandit[sarif]>=1.9.4",
    "github-copilot-sdk==0.2.2",
    "claude-agent-sdk>=0.1.63",
    "json-repair>=0.30",
    "pyan3>=2.6",
]
sast = [
    "bandit[sarif]>=1.9.4",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pydantic-ai[openai,anthropic]==1.63.0",
    "bandit[sarif]>=1.9.4",
]

# [project.scripts]
# Entry point is scar.py at project root (Click CLI).
# No console_scripts — run directly: python scar.py

[tool.hatch.build.targets.wheel]
packages = ["src/security_review", "src/code_analysis", "src/code_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Prepend src/ to sys.path (mirrors scar.py's own sys.path.insert(0, ...) bootstrap)
# so tests always exercise this checkout, never a stale global editable install
# of a differently-located "security_review" package.
pythonpath = ["src"]
